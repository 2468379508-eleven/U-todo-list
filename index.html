<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的待办清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  header {
    background: #4a3aff;
    color: #fff;
    padding: 24px;
  }
  header h1 { font-size: 22px; margin-bottom: 4px; }
  header p { font-size: 13px; opacity: 0.85; }
  .input-area {
    display: flex;
    padding: 16px;
    gap: 8px;
    border-bottom: 1px solid #eee;
  }
  .input-area input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  .input-area input:focus { border-color: #4a3aff; }
  .input-area button {
    padding: 0 20px;
    background: #4a3aff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .input-area button:hover { background: #3a2ce0; }
  .filters {
    display: flex;
    padding: 12px 16px;
    gap: 8px;
    border-bottom: 1px solid #eee;
  }
  .filters button {
    flex: 1;
    padding: 8px;
    border: none;
    background: #f4f4f8;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #555;
    transition: all 0.2s;
  }
  .filters button.active { background: #4a3aff; color: #fff; }
  ul { list-style: none; max-height: 400px; overflow-y: auto; }
  li {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0;
    gap: 12px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  li input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #4a3aff;
    cursor: pointer;
    flex-shrink: 0;
  }
  li .text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-all;
  }
  li.done .text { text-decoration: line-through; color: #aaa; }
  li .del {
    background: none;
    border: none;
    color: #ff4d4f;
    font-size: 20px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  li .del:hover { opacity: 1; }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: #bbb;
    font-size: 14px;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    font-size: 13px;
    color: #888;
    background: #fafafa;
  }
  footer button {
    background: none;
    border: none;
    color: #ff4d4f;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📝 我的待办清单</h1>
    <p>今天也要元气满满地完成任务哦</p>
  </header>

  <div class="input-area">
    <input type="text" id="taskInput" placeholder="添加一个新任务..." maxlength="100">
    <button id="addBtn">添加</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="active">未完成</button>
    <button data-filter="done">已完成</button>
  </div>

  <ul id="taskList"></ul>

  <footer>
    <span id="count">共 0 项</span>
    <button id="clearDone">清除已完成</button>
  </footer>
</div>

<script>
  // 数据：从 localStorage 读取，没有则为空数组
  let tasks = JSON.parse(localStorage.getItem('my_todos') || '[]');
  let currentFilter = 'all';

  const listEl = document.getElementById('taskList');
  const inputEl = document.getElementById('taskInput');
  const countEl = document.getElementById('count');

  // 保存到 localStorage
  function save() {
    localStorage.setItem('my_todos', JSON.stringify(tasks));
  }

  // 渲染列表
  function render() {
    let filtered = tasks;
    if (currentFilter === 'active') filtered = tasks.filter(t => !t.done);
    if (currentFilter === 'done') filtered = tasks.filter(t => t.done);

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty">暂无任务 🎉</div>';
    } else {
      listEl.innerHTML = filtered.map(t => `
        <li class="${t.done ? 'done' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} data-id="${t.id}">
          <span class="text">${escapeHtml(t.text)}</span>
          <button class="del" data-id="${t.id}">×</button>
        </li>
      `).join('');
    }

    const remaining = tasks.filter(t => !t.done).length;
    countEl.textContent = `共 ${tasks.length} 项，未完成 ${remaining} 项`;
    save();
  }

  // 防 XSS
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // 添加任务
  function addTask() {
    const text = inputEl.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false });
    inputEl.value = '';
    render();
  }

  document.getElementById('addBtn').onclick = addTask;
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  // 事件委托：勾选 / 删除
  listEl.addEventListener('click', e => {
    const id = Number(e.target.dataset.id);
    if (!id) return;

    if (e.target.matches('input[type="checkbox"]')) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = e.target.checked;
      render();
    }

    if (e.target.matches('.del')) {
      tasks = tasks.filter(t => t.id !== id);
      render();
    }
  });

  // 筛选
  document.querySelectorAll('.filters button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    };
  });

  // 清除已完成
  document.getElementById('clearDone').onclick = () => {
    tasks = tasks.filter(t => !t.done);
    render();
  };

  // 初始化
  render();
</script>
</body>
</html>
